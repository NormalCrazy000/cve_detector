[project]
name = "cve-detector"
version = "0.1.0"
description = "Self-hosted vulnerability tracker for project dependencies"
readme = "README.md"
license = "MIT"
authors = [
    { name = "NormalCrazy000", email = "36573154+NormalCrazy000@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.146.0",
    "httpx2>=2.15.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "univers>=32.0.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/cve_detector/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["src/cve_detector/db/migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cve_detector --cov-report=term-missing"

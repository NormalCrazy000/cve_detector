<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2328;">
<div style="max-width:680px;margin:0 auto;padding:24px 16px;">
<div style="background:#ffffff;border:1px solid #d8d8dc;border-radius:6px;padding:24px;">
{% block content %}{% endblock %}
</div>
<p style="font-size:12px;color:#6b6f76;line-height:1.5;margin:16px 4px 0;">
{{ app }} &middot; {{ generated }}
{% block footer %}
<br>Vulnerability data from <a href="https://osv.dev" style="color:#6b6f76;">OSV.dev</a> and the databases it aggregates.
<br>The absence of findings does not mean the absence of vulnerabilities.
{% endblock %}
</p>
</div>
</body>
</html>
